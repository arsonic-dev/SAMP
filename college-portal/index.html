<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Portal Demo</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: #fffaf3;
      --ink: #17324d;
      --accent: #c96a3d;
      --line: #e4d4bf;
    }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #fff9ef 0, var(--bg) 55%);
      color: var(--ink);
    }
    main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
    .hero, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(23, 50, 77, 0.08);
      margin-bottom: 18px;
    }
    h1, h2 { margin-top: 0; }
    form { display: grid; gap: 12px; margin-top: 14px; }
    input, textarea, button {
      font: inherit;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    button { background: var(--accent); color: white; border: none; cursor: pointer; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 14px;
      min-height: 80px;
    }
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>College Portal Demo</h1>
    <p>This static client demonstrates tenant registration, user onboarding, login, MFA verification, and protected page authorization against SAMP.</p>
    <label>SAMP base URL
      <input id="baseUrl" value="http://localhost:8080">
    </label>
  </section>

  <section class="row">
    <div class="card">
      <h2>1. Register Tenant</h2>
      <form id="tenantForm">
        <input id="tenantName" value="College Portal">
        <textarea id="tenantScopes">openid
profile
student.read</textarea>
        <textarea id="tenantRedirects">http://localhost:5500/college-portal</textarea>
        <button type="submit">Create Tenant</button>
      </form>
    </div>

    <div class="card">
      <h2>2. Register User</h2>
      <form id="registerForm">
        <input id="tenantId" placeholder="Tenant ID">
        <input id="registerEmail" value="student@example.edu">
        <input id="registerPassword" type="password" value="student-password-123">
        <button type="submit">Register User</button>
      </form>
    </div>
  </section>

  <section class="row">
    <div class="card">
      <h2>3. Login</h2>
      <form id="loginForm">
        <input id="loginTenantId" placeholder="Tenant ID">
        <input id="loginEmail" value="student@example.edu">
        <input id="loginPassword" type="password" value="student-password-123">
        <button type="submit">Login</button>
      </form>
    </div>

    <div class="card">
      <h2>4. Verify MFA</h2>
      <form id="mfaForm">
        <input id="challengeToken" placeholder="Challenge token">
        <input id="mfaCode" placeholder="123456">
        <button type="submit">Verify MFA</button>
      </form>
    </div>
  </section>

  <section class="card">
    <h2>5. Evaluate Protected Page</h2>
    <form id="policyForm">
      <input id="policyUserId" placeholder="User ID">
      <input id="deviceId" value="college-portal-browser">
      <button type="submit">Call /policy/evaluate</button>
    </form>
  </section>

  <section class="card">
    <h2>Output</h2>
    <pre id="output">Ready.</pre>
  </section>
</main>

<script>
  let accessToken = "";
  const output = document.getElementById("output");
  const show = (label, payload) => {
    output.textContent = `${label}\n\n${typeof payload === "string" ? payload : JSON.stringify(payload, null, 2)}`;
  };

  async function post(path, body, auth = false) {
    const baseUrl = document.getElementById("baseUrl").value.trim();
    const response = await fetch(`${baseUrl}${path}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(auth && accessToken ? { "Authorization": `Bearer ${accessToken}` } : {}),
        "X-Device-Id": document.getElementById("deviceId")?.value || "college-portal-browser"
      },
      body: JSON.stringify(body)
    });
    const text = await response.text();
    return { response, data: text ? JSON.parse(text) : {} };
  }

  document.getElementById("tenantForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const { data } = await post("/tenants/register", {
      name: document.getElementById("tenantName").value,
      allowedScopes: document.getElementById("tenantScopes").value.split(/\s+/).filter(Boolean),
      redirectUris: document.getElementById("tenantRedirects").value.split(/\s+/).filter(Boolean)
    });
    document.getElementById("tenantId").value = data.tenantId || "";
    document.getElementById("loginTenantId").value = data.tenantId || "";
    show("Tenant registration", data);
  });

  document.getElementById("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const { data } = await post("/auth/register", {
      tenantId: document.getElementById("tenantId").value,
      email: document.getElementById("registerEmail").value,
      password: document.getElementById("registerPassword").value,
      mfaEnabled: true
    });
    document.getElementById("policyUserId").value = data.userId || "";
    show("User registration", data);
  });

  document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const { data } = await post("/auth/login", {
      tenantId: document.getElementById("loginTenantId").value,
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value
    });
    document.getElementById("challengeToken").value = data.challengeToken || "";
    if (data.tokens?.accessToken) {
      accessToken = data.tokens.accessToken;
    }
    show("Login", data);
  });

  document.getElementById("mfaForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const { data } = await post("/auth/mfa/verify", {
      challengeToken: document.getElementById("challengeToken").value,
      code: document.getElementById("mfaCode").value
    });
    accessToken = data.accessToken || "";
    show("MFA verification", data);
  });

  document.getElementById("policyForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const { response, data } = await post("/policy/evaluate", {
      userId: document.getElementById("policyUserId").value,
      resource: "college.portal.dashboard",
      action: "view",
      context: {
        deviceId: document.getElementById("deviceId").value,
        resourceSensitivity: "MEDIUM"
      }
    }, true);
    const challenge = response.headers.get("X-MFA-Challenge-Token");
    if (challenge) {
      document.getElementById("challengeToken").value = challenge;
    }
    show(`Policy evaluation (${response.status})`, { ...data, mfaChallengeToken: challenge });
  });
</script>
</body>
</html>
