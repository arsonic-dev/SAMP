server:
  port: ${SPRING_PORT:8080}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:samp}
    username: ${POSTGRES_USER:samp}
    password: ${POSTGRES_PASSWORD:samp}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    jwt-issuer: ${JWT_ISSUER:samp-auth-service}
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    mfa-challenge-ttl: ${JWT_MFA_CHALLENGE_TTL:5m}
    totp-issuer: ${TOTP_ISSUER:SAMP}
  risk-engine:
    base-url: ${RISK_ENGINE_BASE_URL:http://localhost:8001}
    cache-ttl: ${RISK_CACHE_TTL:5m}
    step-up-threshold: ${RISK_STEP_UP_THRESHOLD:30.0}
    deny-threshold: ${RISK_DENY_THRESHOLD:70.0}
