services:
  postgres:
    image: postgres:16-alpine
    container_name: samp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samp}
      POSTGRES_USER: ${POSTGRES_USER:-samp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samp} -d ${POSTGRES_DB:-samp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samp-network

  redis:
    image: redis:7-alpine
    container_name: samp-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - samp-network

  auth-service:
    build: ./auth-service
    container_name: samp-auth
    ports:
      - '8082:8080'
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
      - RISK_ENGINE_BASE_URL=http://risk-engine:8001
    networks:
      - samp-network
    depends_on:
      - postgres
      - redis

  risk-engine:
    build: ./risk-engine
    container_name: samp-risk
    ports:
      - '8001:8001'
    environment:
      - REDIS_HOST=redis
    networks:
      - samp-network
    depends_on:
      - redis

volumes:
  postgres-data:

networks:
  samp-network:
    driver: bridge
